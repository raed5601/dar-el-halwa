<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tableau des prix</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <table>
        <caption>Carte des prix — tarifs au kilogramme</caption>
        <thead>
          <tr>
            <th scope="col">categorie</th>
            <th scope="col">produit</th>
            <th scope="col">prix(dt)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="rowgroup" rowspan="4">le sucre fin</th>
            <td>choclats</td>
            <td>45</td>
          </tr>
          <tr>
            <td>Gâteaux</td>
            <td>50</td>
          </tr>
          <tr>
            <td>Morceaux</td>
            <td>6</td>
          </tr>
          <tr>
            <td>Glaces</td>
            <td>4</td>
          </tr>
          <tr>
            <th scope="rowgroup" rowspan="3">Le salé fin</th>
            <td>Bouchées froides</td>
            <td>30</td>
          </tr>
          <tr>
            <td>Brochettes</td>
            <td>70</td>
          </tr>
          <tr>
            <td>Verrines froides</td>
            <td>100</td>
          </tr>
          <tr>
            <th scope="rowgroup" rowspan="2">Pains & viennoiseries</th>
            <td>Pains</td>
            <td>1</td>
          </tr>
          <tr>
            <td>Viennoiseries</td>
            <td>3</td>
          </tr>
          <tr>
            <th scope="rowgroup" rowspan="3">Pains & viennoiseries</th>
            <td>Confitures</td>
            <td>10</td>
          </tr>
          <tr>
            <td>Miels</td>
            <td>50</td>
          </tr>
          <tr>
            <td>Granola</td>
            <td>60</td>
          </tr>
        </tbody>
      </table>
      <a href="index.html">retour</a>
    </main>
  </body>
</html>
